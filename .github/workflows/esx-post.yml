name: ESX price post

on:
  # Runs are started by cron-job.org (see README), because GitHub's own scheduler wasn't
  # firing for this repo. Each cron-job.org job sends a "mode" telling the bot what to do:
  #   9:00 AM EAT   snapshot  -> 🌅 PRE-OPENING post (last close), always posts
  #   9:35 AM EAT   hourly    -> 🔔 OPENING post (any hourly run before 10:00 EAT)
  #   10 AM-3 PM    hourly    -> ⏱️ HOURLY UPDATE posts
  #   (opening + hourly posts are skipped if prices haven't changed since the last post)
  #   3:45 PM EAT   close     -> 🏁 CLOSING post, always posts
  # Don't also add a "schedule:" section here, or posts could happen twice.
  workflow_dispatch:
    inputs:
      mode:
        description: "close = closing post, hourly = opening/hourly post if prices changed, snapshot = pre-opening post"
        type: choice
        options: [close, hourly, snapshot]
        default: close

permissions:
  contents: write # lets the job save the template rotation + price history back to the repo

concurrency: esx-post

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Fetch prices and post
        env:
          # >>> API keys are added HERE, via the repo's Secrets (never in this file). <<<
          # Settings -> Secrets and variables -> Actions -> New repository secret
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }} # expires every 60 days
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}     # optional, leave unset
          X_API_KEY: ${{ secrets.X_API_KEY }}                         # X (Twitter): all four
          X_API_SECRET: ${{ secrets.X_API_SECRET }}                   # come from the X Developer
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}               # Console. Each post costs
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }} # ~$0.015 in X credits.
        run: |
          HOUR=$(TZ=Africa/Addis_Ababa date +%-H)   # current hour in Ethiopia, e.g. 9 or 14
          case "${{ inputs.mode }}" in
            snapshot)                           # 9:00 AM: pre-opening post (last close)
              echo "Pre-opening post."
              python esx_bot.py --send telegram --session preopen --csv data/prices.csv ;;
            hourly)                             # 9:35 AM = opening, 10 AM-3 PM = hourly
              if [ "$HOUR" -lt 10 ]; then SESSION=opening; else SESSION=hourly; fi
              echo "Trading-hours post ($SESSION), only if prices changed."
              python esx_bot.py --send telegram --skip-if-unchanged --session $SESSION --csv data/prices.csv ;;
            *)                                  # close (3:45 PM) or the Run workflow button
              echo "Closing post."
              python esx_bot.py --send all --session closing --csv data/prices.csv ;;
          esac

      # Committing each run keeps the template rotation going between runs, builds your
      # price history, and counts as repo activity (GitHub pauses schedules after 60 idle days).
      - name: Save rotation state and price history
        if: always() # keep history + rotation even if one platform failed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .esx_post_state.json data/prices.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "ESX snapshot $(date -u '+%F %H:%M') UTC"
          git pull --rebase --quiet || true  # in case you edited files on GitHub during the run
          git push
