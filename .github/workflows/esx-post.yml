name: ESX price post

on:
  schedule:
    # Times are UTC. Ethiopia (EAT) is always UTC+3, with no daylight saving, so subtract 3 hours.
    # GitHub often starts scheduled runs 10-30 minutes late; that's normal.
    # ESX day (EAT): pre-open 9:00-9:30, trading 9:30-3:00 PM, closing session 3:00 PM.
    - cron: "0 6 * * 1-5"      # 9:00 AM EAT: start of day - price snapshot saved, not posted
                               # (9:00-9:30 is the pre-open auction; the ticker still shows yesterday)
    - cron: "35 6 * * 1-5"     # 9:35 AM EAT: first post, 5 min after trading opens at 9:30
    - cron: "0 7-12 * * 1-5"   # 10 AM, 11 AM, 12 PM, 1 PM, 2 PM, 3 PM EAT: post on the hour
                               # (9:35 + hourly posts are skipped if prices haven't changed since the last post)
    - cron: "45 12 * * 1-5"    # 3:45 PM EAT: final closing prices (always posts)
  workflow_dispatch: # adds a "Run workflow" button so you can test or post on demand

permissions:
  contents: write # lets the job save the template rotation + price history back to the repo

concurrency: esx-post

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Fetch prices and post
        env:
          # >>> API keys are added HERE, via the repo's Secrets (never in this file). <<<
          # Settings -> Secrets and variables -> Actions -> New repository secret
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }} # expires every 60 days
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}     # optional, leave unset
          X_API_KEY: ${{ secrets.X_API_KEY }}                         # X (Twitter): all four
          X_API_SECRET: ${{ secrets.X_API_SECRET }}                   # come from the X Developer
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}               # Console. Each post costs
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }} # ~$0.015 in X credits.
        run: |
          case "${{ github.event.schedule }}" in
            "0 6 * * 1-5")                      # 9:00 AM: snapshot only
              echo "Start of day: saving prices, nothing posted."
              python esx_bot.py --csv data/prices.csv ;;
            "35 6 * * 1-5"|"0 7-12 * * 1-5")    # 9:35 AM + hourly: post if prices changed
              echo "Trading-hours update: posting only if prices changed."
              python esx_bot.py --send telegram --skip-if-unchanged --csv data/prices.csv ;;
            *)                                  # 3:45 PM close, or a manual run: always post
              python esx_bot.py --send all --csv data/prices.csv ;;
          esac

      # Committing each run keeps the template rotation going between runs, builds your
      # price history, and counts as repo activity (GitHub pauses schedules after 60 idle days).
      - name: Save rotation state and price history
        if: always() # keep history + rotation even if one platform failed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .esx_post_state.json data/prices.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "ESX snapshot $(date -u '+%F %H:%M') UTC"
          git pull --rebase --quiet || true  # in case you edited files on GitHub during the run
          git push
