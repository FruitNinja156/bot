name: ESX price post

on:
  # Runs are started by cron-job.org (see README), because GitHub's own scheduler wasn't
  # firing for this repo. Each cron-job.org job sends a "mode" telling the bot what to do:
  #   9:00 AM EAT          snapshot  - save prices, don't post (pre-open auction)
  #   9:35 AM, 10 AM-3 PM  hourly    - post only if prices changed since the last post
  #   3:45 PM EAT          close     - always post the closing prices
  # Don't also add a "schedule:" section here, or posts could happen twice.
  workflow_dispatch:
    inputs:
      mode:
        description: "close = always post, hourly = post if prices changed, snapshot = save only"
        type: choice
        options: [close, hourly, snapshot]
        default: close

permissions:
  contents: write # lets the job save the template rotation + price history back to the repo

concurrency: esx-post

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Fetch prices and post
        env:
          # >>> API keys are added HERE, via the repo's Secrets (never in this file). <<<
          # Settings -> Secrets and variables -> Actions -> New repository secret
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }} # expires every 60 days
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}     # optional, leave unset
          X_API_KEY: ${{ secrets.X_API_KEY }}                         # X (Twitter): all four
          X_API_SECRET: ${{ secrets.X_API_SECRET }}                   # come from the X Developer
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}               # Console. Each post costs
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }} # ~$0.015 in X credits.
        run: |
          case "${{ inputs.mode }}" in
            snapshot)                           # 9:00 AM: save only
              echo "Start of day: saving prices, nothing posted."
              python esx_bot.py --csv data/prices.csv ;;
            hourly)                             # 9:35 AM + on the hour: post if prices changed
              echo "Trading-hours update: posting only if prices changed."
              python esx_bot.py --send telegram --skip-if-unchanged --csv data/prices.csv ;;
            *)                                  # close (3:45 PM) or the Run workflow button
              echo "Closing update: always posting."
              python esx_bot.py --send all --csv data/prices.csv ;;
          esac

      # Committing each run keeps the template rotation going between runs, builds your
      # price history, and counts as repo activity (GitHub pauses schedules after 60 idle days).
      - name: Save rotation state and price history
        if: always() # keep history + rotation even if one platform failed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .esx_post_state.json data/prices.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "ESX snapshot $(date -u '+%F %H:%M') UTC"
          git pull --rebase --quiet || true  # in case you edited files on GitHub during the run
          git push
